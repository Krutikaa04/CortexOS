[project]
name = "cortex"
version = "1.0.0"
description = "CortexOS — adaptive inference runtime (control plane + worker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "httpx>=0.27",
    "greenlet>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["cortex*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# High-signal, low-false-positive set: pyflakes (real bugs: undefined names,
# unused imports) + syntax/runtime errors. Style-only and opinionated lint
# families are intentionally excluded so CI stays meaningful, not noisy.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E402"]  # tests bind values for clarity; group imports by topic
"alembic/*" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
